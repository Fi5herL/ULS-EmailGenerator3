<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULS Email Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <img src="icons/icon48.png" alt="ULS" class="popup-logo">
      <div class="popup-title-block">
        <h1 class="popup-title">ULS Email Generator</h1>
        <span class="popup-version">v1.0.0</span>
      </div>
    </div>

    <div class="popup-body">
      <button id="open-generator-btn" class="btn-primary">
        <span class="btn-icon">✉</span>
        Open Email Generator
      </button>

      <div class="popup-note">
        <span class="note-icon">ℹ</span>
        On <strong>portal.ul.com/Project/Details/*</strong> pages, the panel activates automatically and extracts project data directly from the page.
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
